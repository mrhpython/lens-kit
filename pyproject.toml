[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-kit"
version = "0.1.0"
description = "Trainable 10-lens validation gate for AI-generated text (DSPy). Provider-agnostic: bring any litellm-compatible endpoint."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Soulfield" }]
keywords = ["ai", "evaluation", "validation", "dspy", "llm"]
# Licence: Apache-2.0. The grant lives in the root LICENSE file; NOTICE carries the
# third-party attribution for src/lens_kit/review/. The trove classifier is used rather
# than a PEP 639 `license = "Apache-2.0"` expression because the SPDX string is only
# accepted from setuptools>=77 and would require raising the build floor below.
# Verified 2026-07-30 by building metadata under both setuptools 68.1.2 and 81.0.0:
# classifier-only succeeds on both; SPDX-string fails on 68; SPDX+classifier fails on 81.
# If the floor is ever raised to setuptools>=77, replace the classifier with
#   license = "Apache-2.0"
#   license-files = ["LICENSE", "NOTICE"]
# and remove the classifier (77+ rejects a licence classifier alongside an expression).
# setuptools' default license_files glob picks up LICENSE and NOTICE on both versions.
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # NOTE: dspy pins gepa transitively (dspy 3.2.x -> gepa 0.0.27).
    # Do NOT depend on gepa directly — the dspy pin is the contract.
    "dspy>=3.2,<3.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lens-kit = "lens_kit.cli:entry"

[project.urls]
Homepage = "https://soulfield.one"
Repository = "https://github.com/mrhpython/lens-kit"
Issues = "https://github.com/mrhpython/lens-kit/issues"
Changelog = "https://github.com/mrhpython/lens-kit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lens_kit = ["profiles/*.yaml", "catches_seed.jsonl"]
"lens_kit.review" = ["viewer.html", "LICENSE.Apache-2.0", "NOTICE"]

[tool.pytest.ini_options]
# The kit's own suite lives in tests/. A bare `pytest` from a clean clone broke
# with 7 collection errors once integrations/claude-code/ was added, because:
#   - its tests/conftest.py collides with tests/conftest.py — neither directory
#     is a package, and "claude-code" cannot become one (a hyphen is not a valid
#     Python identifier), so both register as top-level module `conftest`; and
#   - its lens_stop_hook module is not installed by this project's dev extra.
# Scoping collection to tests/ fixes both. Measured at 3ad71c9: 515 passed,
# 2 skipped (517 collected). The 2 skips are guarded on eval data deliberately
# kept private, so a bare "517 tests pass" would be false.
#
# Do NOT add --import-mode=importlib here: tests/ use `from conftest import
# make_stub_gate`, which needs the default prepend mode to resolve.
#
# LIMITATION — this does NOT cover integrations/. Those suites need lens_kit
# installed alongside the adapter:
#     pip install -e ".[dev]" && pip install -e integrations/claude-code
#     python -m pytest integrations/claude-code
#     PYTHONPATH=integrations/codex python -m pytest integrations/codex/tests
# GitHub CI runs each integration suite in a separate matrix job so their
# same-named test modules never collide during collection.
testpaths = ["tests"]
