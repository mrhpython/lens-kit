[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-grok-hook"
version = "0.1.0"
description = "Observational Grok Stop adapter for the lens-kit outside-in validation gate"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["lens-kit==0.1.0"]

[project.scripts]
lens-grok-stop-hook = "lens_grok_hook.hook:main"

[project.urls]
Repository = "https://github.com/mrhpython/lens-kit"
Documentation = "https://github.com/mrhpython/lens-kit/tree/main/integrations/grok"

[tool.setuptools.packages.find]
include = ["lens_grok_hook*"]
