<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 420" role="img" aria-label="Architecture: your agent's output goes through the lens-kit gate (10 lenses, separate model, outside-in) and comes out PASS (ships) or FLAG (findings, human review). Gate unreachable means FLAG — fail-closed.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#24292f"/></marker>
  </defs>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="16" y="160" width="160" height="84" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <path d="M84 174 h20 l8 8 v18 h-28 z M104 174 v8 h8" fill="none" stroke="#57606a" stroke-width="1.3"/>
    <text x="96" y="214" text-anchor="middle" font-size="13" fill="#24292f">your agent's</text>
    <text x="96" y="230" text-anchor="middle" font-size="13" fill="#24292f">output</text>
    <line x1="176" y1="202" x2="242" y2="202" stroke="#24292f" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="250" y="48" width="300" height="308" rx="6" fill="#fbfcfe" stroke="#24292f" stroke-width="1.5"/>
    <text x="400" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">lens-kit gate</text>
    <text x="400" y="94" text-anchor="middle" font-size="11.5" fill="#57606a">10 lenses &#183; separate model &#183; outside-in</text>
    <g font-size="11.5" fill="#24292f">
      <rect x="262" y="106" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="330" y="126" text-anchor="middle">Rights</text>
      <rect x="406" y="106" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="474" y="126" text-anchor="middle">Truth</text>
      <rect x="262" y="144" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="330" y="164" text-anchor="middle">Causality</text>
      <rect x="406" y="144" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="474" y="164" text-anchor="middle">Definitions</text>
      <rect x="262" y="182" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="330" y="202" text-anchor="middle">Contradiction</text>
      <rect x="406" y="182" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="474" y="202" text-anchor="middle">Extrapolation</text>
      <rect x="262" y="220" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="330" y="240" text-anchor="middle">Structure</text>
      <rect x="406" y="220" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="474" y="240" text-anchor="middle">Consistency</text>
      <rect x="262" y="258" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="330" y="278" text-anchor="middle">Relevance</text>
      <rect x="406" y="258" width="136" height="32" rx="4" fill="#f2f5f9" stroke="#d5dbe4"/><text x="474" y="278" text-anchor="middle">Conscious scan</text>
    </g>
    <text x="400" y="330" text-anchor="middle" font-size="10.5" fill="#57606a">fixed checks &#183; inspectable findings</text>
    <line x1="550" y1="202" x2="598" y2="202" stroke="#24292f" stroke-width="1.5"/>
    <circle cx="600" cy="202" r="3" fill="#24292f"/>
    <path d="M600 202 V120 H608" stroke="#24292f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M600 202 V286 H608" stroke="#24292f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="616" y="88" width="180" height="64" rx="6" fill="#f2fbf5" stroke="#2da44e" stroke-width="1.5"/>
    <path d="M634 118 l7 7 l13 -14" stroke="#1a7f37" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="672" y="115" font-size="14" font-weight="700" fill="#1a7f37">PASS</text>
    <text x="672" y="133" font-size="11.5" fill="#57606a">ships</text>
    <rect x="616" y="254" width="180" height="64" rx="6" fill="#fff9ec" stroke="#d29922" stroke-width="1.5"/>
    <path d="M636 296 V276 l16 5 l-16 5" stroke="#9a6700" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="672" y="281" font-size="14" font-weight="700" fill="#9a6700">FLAG</text>
    <text x="672" y="299" font-size="11.5" fill="#57606a">findings</text>
    <line x1="706" y1="318" x2="706" y2="346" stroke="#24292f" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="616" y="352" width="180" height="48" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="706" y="380" text-anchor="middle" font-size="11.5" fill="#24292f">human review surface</text>
    <rect x="16" y="360" width="310" height="44" rx="6" fill="none" stroke="#d29922" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="171" y="386" text-anchor="middle" font-size="11.5" fill="#9a6700">gate unreachable &#8594; FLAG (fail-closed)</text>
  </g>
</svg>
