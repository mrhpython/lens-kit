name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests

  adapter-tests:
    name: ${{ matrix.adapter }} adapter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [claude-code, codex, grok]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e "integrations/${{ matrix.adapter }}"
      - run: python -m pytest "integrations/${{ matrix.adapter }}/tests"

  build:
    name: Build release distributions
    needs: [core-tests, adapter-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - name: Build core and adapters
        run: |
          mkdir -p dist/release
          python -m build --outdir dist/release .
          python -m build --outdir dist/release integrations/claude-code
          python -m build --outdir dist/release integrations/codex
          python -m build --outdir dist/release integrations/grok
      - run: python -m twine check dist/release/*
      - name: Clean-wheel install smoke
        run: |
          python -m venv /tmp/lens-release-smoke
          /tmp/lens-release-smoke/bin/python -m pip install dist/release/*.whl
          /tmp/lens-release-smoke/bin/python -c "import lens_kit, lens_stop_hook, lens_codex_hook, lens_grok_hook"
          test -x /tmp/lens-release-smoke/bin/lens-kit
          test -x /tmp/lens-release-smoke/bin/lens-stop-hook
          test -x /tmp/lens-release-smoke/bin/lens-codex-stop-hook
          test -x /tmp/lens-release-smoke/bin/lens-grok-stop-hook
      - name: Create checksums
        run: |
          cd dist/release
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/release/
          if-no-files-found: error
