# [domain] Customer-vocabulary slots for the planted-flaw calibration battery
# (`lens-kit calibrate generate`). TEMPLATE-based, no LLM calls; these are the
# only customer-specific strings interpolated into the fixtures. Replace with
# YOUR company/product/audience so the battery reads like your real content —
# the planted flaws (contradiction / dark pattern / uncited statistic) are
# structural and identical regardless of the slot values.
calibration:
  company: Acme Agency
  product: our AI review platform
  audience: agency owners evaluating AI tools
  competitor: traditional agencies
  output_type: marketing copy
  price: 49 a month
  stat: 87% of buyers
  metric: 3x improvement in reply rates
  timeframe: 90 days

# [domain] Deterministic consistency tripwires (`lens-kit consistency`).
# No LLM, no network. These are EXAMPLE entries — replace `deny` with YOUR
# internal vocabulary so it can never leak into customer-facing copy.
consistency:
  # Evidence markers whose count must survive source -> rendered outputs.
  # Keep these unless your house style uses different honesty tokens.
  markers:
    - "[UNVERIFIED]"
    - "[ESTIMATE]"
    - "[PROJECTION]"
  # Case-insensitive literal strings that must NEVER reach customer-facing
  # copy. One hit = a consistency violation (exit 6) no score overrides.
  # EXAMPLES of the two classes the validator's memory says leak most:
  #   - internal lens / scoring vocabulary and counts
  #   - cost / margin / per-unit-price data
  # Replace with the actual phrases YOUR internal docs use.
  deny:
    # internal lens-pipeline vocabulary (example placeholders)
    - "lens gate"
    - "per_lens"
    - "rollouts"
    - "checkpoint sha"
    # cost / margin data that should stay internal (example placeholders)
    - "cost per rollout"
    - "gross margin"
    - "COGS"
    - "internal cost"
